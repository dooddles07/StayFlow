# API-only service. The frontend is deployed separately to Vercel, which
# proxies /api/* here via a rewrite (see vercel.json) so the browser still
# sees a single origin — the auth cookie is SameSite=Lax and would not be
# sent on a genuinely cross-site request.
#
# --include=dev on the install: NODE_ENV=production (set below, needed at
# runtime) makes plain `npm install` skip devDependencies, but the prisma
# CLI used by generate/migrate is a devDependency.
services:
  - type: web
    name: stayflow
    runtime: node
    plan: free
    buildCommand: >-
      cd server &&
      npm install --include=dev &&
      npx prisma generate &&
      npx prisma migrate deploy
    startCommand: cd server && node server.js
    # Plain Express route (server/src/routes/index.js) — no render, no DB call.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      # Requests arrive via Vercel's server-side rewrite, not a browser
      # cross-origin fetch, so no CORS allowlist is needed. env.js fails
      # closed to [] rather than a wildcard.
      - key: CORS_ORIGIN
        value: ""
      # Set in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false
