# API-only service. The frontend is deployed separately to Vercel, which
# proxies /api/* here via a rewrite (see vercel.json) so the browser still
# sees a single origin — the auth cookie is SameSite=Lax and would not be
# sent on a genuinely cross-site request.
#
# --include=dev on the install: NODE_ENV=production (set below, needed at
# runtime) makes plain `npm install` skip devDependencies, but the prisma
# CLI used by generate/migrate is a devDependency.
services:
  - type: web
    name: stayflow
    runtime: node
    plan: free
    buildCommand: >-
      cd server &&
      npm install --include=dev &&
      npx prisma generate &&
      npx prisma migrate deploy
    # --import loads Sentry before anything else imports express or prisma; its
    # auto instrumentation patches modules at load time. Inert without SENTRY_DSN.
    startCommand: cd server && node --import ./instrument.mjs server.js
    # Plain Express route (server/src/routes/index.js) — no render, no DB call.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      # Requests arrive via Vercel's server-side rewrite, not a browser
      # cross-origin fetch, so no CORS allowlist is needed. env.js fails
      # closed to [] rather than a wildcard.
      - key: CORS_ORIGIN
        value: ""
      # Set in the Render dashboard, not here. Use Neon's POOLED host (-pooler) —
      # the running API opens a pool per process and the direct host allows too
      # few connections for that on the free plan.
      - key: DATABASE_URL
        sync: false
      # Neon's DIRECT (non-pooled) host. The build step's `prisma migrate deploy`
      # above needs one real session for advisory locks and DDL, which DATABASE_URL's
      # PgBouncer pooling cannot provide — see directUrl in schema.prisma.
      - key: DIRECT_URL
        sync: false
      # Mail delivery. The API refuses to boot in production without these two
      # (server/src/config/env.js): no key means reset links are never sent, and
      # no APP_URL means the link that would be sent points at localhost.
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      # Must be a Resend-verified domain. The default sandbox sender only
      # delivers to the Resend account owner's own address.
      - key: MAIL_FROM
        sync: false
      # Error tracking. Unset => Sentry never initialises and nothing is sent.
      - key: SENTRY_DSN
        sync: false
      # Photo uploads. The browser uploads straight to Cloudinary using a
      # signature this API produces, so the secret stays server-side and no
      # image bytes pass through Render or Postgres. Unset => the signature
      # endpoint 503s and the admin UI asks for a photo URL instead.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
