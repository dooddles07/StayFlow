name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values — the build step only runs `prisma generate` (schema validation,
      # no real connection) and `vite build`, neither of which talks to a database.
      # Password-less on purpose: nothing here connects, and it keeps the
      # secret-scan job below strict rather than needing an exception for CI's
      # own config.
      DATABASE_URL: postgresql://ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci@localhost:5432/ci
      JWT_SECRET: ci-only-placeholder-secret-not-a-real-credential-32chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm run lint:server
      - run: npm run typecheck
      # Coverage rather than a plain run, so the thresholds in vitest.config.ts
      # are enforced here and not only when someone remembers to check.
      - run: npm run test:coverage
      - run: npm run build

  # The booking uniqueness guard is a partial unique index that Prisma cannot
  # express, so it lives in raw SQL inside a migration. Nothing in the schema
  # file mentions it, which means a future `db push` or a hand-edited migration
  # could drop it and no other check would notice. Applying every migration to a
  # real Postgres and then diffing it against the schema is what catches that.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stayflow_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stayflow_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/stayflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefix server
      - name: Apply every migration from empty
        run: npx prisma migrate deploy --schema=server/prisma/schema.prisma
      # A plain `migrate diff` cannot be used here: the partial index is
      # deliberately absent from the schema file, so diff would always report it
      # as drift. Asserting the index exists checks the thing that matters.
      - name: Assert the double-booking index survived
        run: |
          npx prisma db execute --schema=server/prisma/schema.prisma --stdin <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE indexname = 'bookings_facility_date_slot_active_key'
            ) THEN
              RAISE EXCEPTION
                'bookings_facility_date_slot_active_key is missing — the database no longer prevents double-booking';
            END IF;
          END $$;
          SQL

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Separate job so a newly-disclosed advisory in a transitive dependency
      # surfaces as its own red check rather than blocking the build signal.
      # `high` is the threshold: moderate advisories in build-only tooling are
      # noise on a project this size, a high/critical one is not.
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix server

  # Fails if a committed file contains something shaped like a live credential.
  # The repo has had a 136 kB AI-review diff dump committed before; this is the
  # cheap check that a real secret never follows it in.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credential-shaped strings
        run: |
          set -uo pipefail
          # Documentation and .example files legitimately carry placeholder
          # connection strings, so they are excluded via git pathspecs (which
          # belong on git ls-files, not on grep).
          if git ls-files -z -- . ':!*.example' ':!*.md' ':!docs/**' \
            | xargs -0 -r grep -nEI \
              -e 'postgres(ql)?://[^ "'"'"']*:[^ "'"'"']*@' \
              -e '(sk|rk|re)_(live|test)_[A-Za-z0-9]{16,}' \
              -e 'BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "::error::A tracked file contains a credential-shaped string. Remove it and rotate the secret."
            exit 1
          fi
          echo "No credential-shaped strings in tracked files."
