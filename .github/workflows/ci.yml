name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values — the build step only runs `prisma generate` (schema validation,
      # no real connection) and `vite build`, neither of which talks to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-placeholder-secret-not-a-real-credential-32chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run lint
      - run: npm run lint:server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
